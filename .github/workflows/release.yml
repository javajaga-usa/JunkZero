name: Release
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.11.1
      - run: pyinstaller --noconfirm packaging/JunkZero.spec
      - name: Smoke test the exe
        shell: pwsh
        env:
          JUNKZERO_DATA_DIR: ${{ runner.temp }}\junkzero-data
        run: |
          $target = Join-Path $env:RUNNER_TEMP "junk-target"
          New-Item -ItemType Directory -Force $target | Out-Null
          New-Item -ItemType File -Force (Join-Path $target "old.tmp") | Out-Null
          # Report mode scans without deleting and saves a report
          $p = Start-Process dist\JunkZero.exe -ArgumentList "--mode", "report", "--path", $target -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Report mode exited with $($p.ExitCode)" }
          $report = Get-Content (Join-Path $env:JUNKZERO_DATA_DIR "latest_report.json") | ConvertFrom-Json
          if ($report.item_count -lt 1) { throw "Report found nothing" }
          if (-not (Test-Path (Join-Path $target "old.tmp"))) { throw "Report mode deleted a file" }
          # Server mode serves the bundled UI and icons
          $server = Start-Process dist\JunkZero.exe -ArgumentList "--mode", "server", "--port", "8765" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              try { $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing; $ok = $true } catch {}
            }
            if (-not $ok) { throw "Server did not start" }
            if ($page.Content -notmatch "JunkZero") { throw "UI page missing" }
            Invoke-WebRequest http://127.0.0.1:8765/static/vendor/lucide-1.46.0.min.js -UseBasicParsing | Out-Null
            $api = Invoke-RestMethod http://127.0.0.1:8765/openapi.json
            Write-Host "Packaged JunkZero $($api.info.version) is serving the UI"
          } finally {
            Stop-Process -Id $server.Id -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: JunkZero-exe
          path: dist/JunkZero.exe
          if-no-files-found: error

  publish:
    # A pushed v* tag, or a manual run that tags the version in app/__init__.py
    if: github.event_name != 'pull_request'
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JunkZero-exe
      - name: Work out the version and release notes
        id: version
        run: |
          version=$(python3 -c "import app; print(app.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # The CHANGELOG section for this version, without its heading
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" JunkZero.exe --title "JunkZero $TAG" --notes-file notes.md --target "$GITHUB_SHA"
