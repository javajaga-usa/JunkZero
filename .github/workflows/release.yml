name: Release
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -c packaging/release-constraints.txt pyinstaller
      # A folder build: dist\JunkZero\JunkZero.exe and the files it needs next to it
      - run: pyinstaller --noconfirm packaging/JunkZero.spec
      - name: Smoke test the exe
        shell: pwsh
        env:
          JUNKZERO_DATA_DIR: ${{ runner.temp }}\junkzero-data
        run: |
          $exe = "dist\JunkZero\JunkZero.exe"
          $target = Join-Path $env:RUNNER_TEMP "junk-target"
          New-Item -ItemType Directory -Force $target | Out-Null
          New-Item -ItemType File -Force (Join-Path $target "old.tmp") | Out-Null
          # Report mode scans without deleting and saves a report
          $p = Start-Process $exe -ArgumentList "--mode", "report", "--path", $target -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Report mode exited with $($p.ExitCode)" }
          $report = Get-Content (Join-Path $env:JUNKZERO_DATA_DIR "latest_report.json") | ConvertFrom-Json
          if ($report.item_count -lt 1) { throw "Report found nothing" }
          if (-not (Test-Path (Join-Path $target "old.tmp"))) { throw "Report mode deleted a file" }
          # Server mode serves the bundled UI and icons
          $server = Start-Process $exe -ArgumentList "--mode", "server", "--port", "8765" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              try { $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing; $ok = $true } catch {}
            }
            if (-not $ok) { throw "Server did not start" }
            if ($page.Content -notmatch "JunkZero") { throw "UI page missing" }
            Invoke-WebRequest http://127.0.0.1:8765/static/vendor/lucide-1.46.0.min.js -UseBasicParsing | Out-Null
            $api = Invoke-RestMethod http://127.0.0.1:8765/openapi.json
            Write-Host "Packaged JunkZero $($api.info.version) is serving the UI"
          } finally {
            Stop-Process -Id $server.Id -Force
          }
      - name: Smoke test delete and restore
        # Scans a folder, moves a file to the Recycle Bin and puts it back through Cleanup
        # History, using the app token the exe prints in server mode. Not yet blocking: the
        # windowed exe may print nothing when it has no console, and the runner's Recycle Bin
        # is untested. Make it blocking once it has passed on the runner.
        continue-on-error: true
        shell: pwsh
        env:
          JUNKZERO_DATA_DIR: ${{ runner.temp }}\junkzero-data-restore
        run: |
          $exe = "dist\JunkZero\JunkZero.exe"
          $target = Join-Path $env:RUNNER_TEMP "restore-target"
          New-Item -ItemType Directory -Force $target | Out-Null
          $file = Join-Path $target "old.tmp"
          Set-Content -Path $file -Value "junk"
          (Get-Item $file).LastWriteTime = (Get-Date).AddDays(-90)
          $out = Join-Path $env:RUNNER_TEMP "server-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "server-err.txt"
          $server = Start-Process $exe -ArgumentList "--mode", "server", "--port", "8766" -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $token = $null
            for ($i = 0; $i -lt 30 -and -not $token; $i++) {
              Start-Sleep -Seconds 1
              $m = Select-String -Path $out -Pattern 'token=(\S+)' -ErrorAction SilentlyContinue
              if ($m) { $token = $m.Matches[0].Groups[1].Value }
            }
            if (-not $token) { throw "Could not read the app token from the server output" }
            $base = "http://127.0.0.1:8766"
            $h = @{ "X-JunkZero-Token" = $token }
            $scan = @{ target_path = $target; skip_system_dirs = $true } | ConvertTo-Json
            Invoke-RestMethod "$base/api/scan/start" -Method Post -Headers $h -ContentType "application/json" -Body $scan | Out-Null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              $status = Invoke-RestMethod "$base/api/scan/status" -Headers $h
              if ($status.status -ne "running") { break }
            }
            $clean = @{ items = @(@{ path = $file }); permanent = $false; confirm_text = "DELETE" } | ConvertTo-Json -Depth 4
            $result = Invoke-RestMethod "$base/api/clean" -Method Post -Headers $h -ContentType "application/json" -Body $clean
            if ($result.deleted_count -ne 1) { throw "Delete failed: $($result | ConvertTo-Json -Depth 5)" }
            if (Test-Path $file) { throw "The file is still there after the delete" }
            $history = Invoke-RestMethod "$base/api/history" -Headers $h
            $restore = @{ timestamp = $history.history[0].timestamp } | ConvertTo-Json
            $restored = Invoke-RestMethod "$base/api/history/restore" -Method Post -Headers $h -ContentType "application/json" -Body $restore
            if (-not (Test-Path $file)) { throw "Restore did not put the file back: $($restored | ConvertTo-Json -Depth 5)" }
            Write-Host "Deleted to the Recycle Bin and restored $file"
          } finally {
            Stop-Process -Id $server.Id -Force
          }
      - name: Smoke test the portable copy's Start menu and desktop shortcuts
        shell: pwsh
        env:
          JUNKZERO_DATA_DIR: ${{ runner.temp }}\junkzero-data-shortcuts
        run: |
          $exe = (Resolve-Path "dist\JunkZero\JunkZero.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "shortcuts-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "shortcuts-err.txt"
          $server = Start-Process $exe -ArgumentList "--mode", "server", "--port", "8767" -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $token = $null
            for ($i = 0; $i -lt 30 -and -not $token; $i++) {
              Start-Sleep -Seconds 1
              $m = Select-String -Path $out -Pattern 'token=(\S+)' -ErrorAction SilentlyContinue
              if ($m) { $token = $m.Matches[0].Groups[1].Value }
            }
            if (-not $token) { throw "Could not read the app token from the server output" }
            $h = @{ "X-JunkZero-Token" = $token }
            $status = Invoke-RestMethod "http://127.0.0.1:8767/api/shortcuts" -Headers $h
            if (-not $status.offer) { throw "The portable copy was not offered shortcuts: $($status | ConvertTo-Json -Depth 4)" }
            $body = @{ places = @("start_menu", "desktop") } | ConvertTo-Json
            Invoke-RestMethod "http://127.0.0.1:8767/api/shortcuts" -Method Post -Headers $h -ContentType "application/json" -Body $body | Out-Null
          } finally {
            Stop-Process -Id $server.Id -Force
          }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($folder in @([Environment]::GetFolderPath("Programs"), [Environment]::GetFolderPath("Desktop"))) {
            $lnk = Join-Path $folder "JunkZero.lnk"
            if (-not (Test-Path $lnk)) { throw "No shortcut at $lnk" }
            $target = $shell.CreateShortcut($lnk).TargetPath
            if ($target -ne $exe) { throw "$lnk starts $target, not $exe" }
            Remove-Item $lnk
          }
          Write-Host "The portable copy made Start menu and desktop shortcuts to $exe"
      - name: Build the installer and the portable zip
        shell: pwsh
        run: |
          $version = python -c "import app; print(app.__version__)"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\JunkZero.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (-not (Test-Path dist\JunkZero-Setup.exe)) { throw "No installer was made" }
          # Portable: the same folder in a zip, run JunkZero.exe from wherever it is unpacked
          Compress-Archive -Path dist\JunkZero -DestinationPath dist\JunkZero-Windows-portable.zip -Force
      - name: Smoke test the installer and uninstaller
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "JunkZero-installed"
          $p = Start-Process dist\JunkZero-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir "JunkZero.exe"))) { throw "Setup did not install JunkZero.exe" }
          # A scheduled scan the uninstaller must remove (name as in app/engine/scheduler.py)
          $task = "JunkZero Scheduled Scan"
          schtasks /Create /F /SC DAILY /ST 09:00 /TN $task /TR "cmd /c exit 0" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not create the test task" }
          # The junkzero: link JunkZero registers for notification clicks (app/engine/notify.py)
          New-Item -Path "HKCU:\Software\Classes\junkzero\shell\open\command" -Force | Out-Null
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # The uninstaller hands over to a copy of itself, so wait for it to finish
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "JunkZero.exe")); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir "JunkZero.exe")) { throw "Uninstall left JunkZero.exe behind" }
          $still = $false
          for ($i = 0; $i -lt 30; $i++) {
            schtasks /Query /TN $task 2>$null | Out-Null
            $still = ($LASTEXITCODE -eq 0)
            if (-not $still) { break }
            Start-Sleep -Seconds 1
          }
          if ($still) { throw "Uninstall left the scheduled scan behind" }
          if (Test-Path "HKCU:\Software\Classes\junkzero") { throw "Uninstall left the junkzero: link behind" }
          Write-Host "Installer and uninstaller work; the scheduled scan and the junkzero: link were removed"
          # schtasks /Query exits 1 once the task is gone, which would otherwise fail the step
          exit 0
      # Per-run download for testers: the folder build (unzip, run JunkZero.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: JunkZero-exe
          path: dist/JunkZero/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: JunkZero-Windows
          path: |
            dist/JunkZero-Setup.exe
            dist/JunkZero-Windows-portable.zip
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -c packaging/release-constraints.txt pyinstaller
      - run: pyinstaller --noconfirm packaging/JunkZero.spec
      - name: Smoke test the app
        env:
          JUNKZERO_DATA_DIR: ${{ runner.temp }}/junkzero-data
        run: |
          bin=dist/JunkZero.app/Contents/MacOS/JunkZero
          target="$RUNNER_TEMP/junk-target"
          mkdir -p "$target"
          touch "$target/old.tmp"
          # Report mode scans without deleting and saves a report
          "$bin" --mode report --path "$target"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['item_count'] >= 1, 'Report found nothing'" "$JUNKZERO_DATA_DIR/latest_report.json"
          test -f "$target/old.tmp" || { echo "Report mode deleted a file"; exit 1; }
          # Server mode serves the bundled UI and icons
          "$bin" --mode server --port 8765 &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ -o page.html && break
            sleep 1
          done
          grep -q JunkZero page.html || { echo "UI page missing"; exit 1; }
          curl -fsS http://127.0.0.1:8765/static/vendor/lucide-1.46.0.min.js -o /dev/null
          curl -fsS http://127.0.0.1:8765/api/system/info | grep -q '"platform":"macos"'
          echo "Packaged JunkZero $(curl -fsS http://127.0.0.1:8765/openapi.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])') is serving the UI"
      - name: Zip the app
        # ditto keeps the bundle's symlinks and signatures intact
        run: ditto -c -k --keepParent dist/JunkZero.app JunkZero-macOS.zip
      - name: Make the disk image
        # Opening JunkZero-macOS.dmg shows JunkZero next to a shortcut to Applications to drag it onto
        run: |
          stage=$(mktemp -d)
          ditto dist/JunkZero.app "$stage/JunkZero.app"
          ln -s /Applications "$stage/Applications"
          # hdiutil sometimes reports "Resource busy" on hosted runners; try again before giving up
          for i in 1 2 3; do
            hdiutil create -volname JunkZero -srcfolder "$stage" -fs HFS+ -format UDZO -ov JunkZero-macOS.dmg && break
            sleep 5
          done
          test -f JunkZero-macOS.dmg
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" JunkZero-macOS.dmg
          test -x "$mnt/JunkZero.app/Contents/MacOS/JunkZero" || { echo "The app is missing from the disk image"; exit 1; }
          test "$(readlink "$mnt/Applications")" = /Applications || { echo "The Applications shortcut is missing"; exit 1; }
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v4
        with:
          name: JunkZero-macOS
          path: |
            JunkZero-macOS.dmg
            JunkZero-macOS.zip
          if-no-files-found: error

  build-linux:
    # Ubuntu 22.04's C library is older than MX Linux 23's and Debian 12's, so the build runs on both
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -c packaging/release-constraints.txt pyinstaller Pillow
      - run: pyinstaller --noconfirm packaging/JunkZero.spec
      - name: Smoke test the app
        env:
          JUNKZERO_DATA_DIR: ${{ runner.temp }}/junkzero-data
        run: |
          bin=dist/JunkZero/JunkZero
          target="$RUNNER_TEMP/junk-target"
          mkdir -p "$target/tmp"
          touch "$target/tmp/old.tmp"
          # Report mode scans without deleting and saves a report
          "$bin" --mode report --no-junk-locations --path "$target"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['item_count'] >= 1, 'Report found nothing'" "$JUNKZERO_DATA_DIR/latest_report.json"
          test -f "$target/tmp/old.tmp" || { echo "Report mode deleted a file"; exit 1; }
          # Server mode serves the bundled UI and icons
          "$bin" --mode server --port 8765 &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ -o page.html && break
            sleep 1
          done
          grep -q JunkZero page.html || { echo "UI page missing"; exit 1; }
          curl -fsS http://127.0.0.1:8765/static/vendor/lucide-1.46.0.min.js -o /dev/null
          curl -fsS http://127.0.0.1:8765/api/system/info | grep -q '"platform":"linux"'
          echo "Packaged JunkZero $(curl -fsS http://127.0.0.1:8765/openapi.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])') is serving the UI"
      - name: Smoke test delete to the Trash and restore
        env:
          JUNKZERO_DATA_DIR: ${{ runner.temp }}/junkzero-data-restore
        run: packaging/linux/smoke-test-restore.sh dist/JunkZero/JunkZero 8766 "$RUNNER_TEMP/restore-target"
      - name: Smoke test the portable copy's applications-menu entry
        env:
          JUNKZERO_DATA_DIR: ${{ runner.temp }}/junkzero-data-shortcuts
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
        run: |
          bin=$(readlink -f dist/JunkZero/JunkZero)
          out=$(mktemp)
          "$bin" --mode server --port 8767 > "$out" 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          token=""
          for i in $(seq 1 30); do
            token=$(grep -o 'token=[^ ]*' "$out" | head -1 | cut -d= -f2 || true)
            [ -n "$token" ] && curl -fsS "http://127.0.0.1:8767/api/system/info" >/dev/null 2>&1 && break
            sleep 1
          done
          status=$(curl -fsS http://127.0.0.1:8767/api/shortcuts -H "X-JunkZero-Token: $token"); echo "$status"
          echo "$status" | grep -q '"offer":true'
          curl -fsS -X POST http://127.0.0.1:8767/api/shortcuts -H "X-JunkZero-Token: $token" \
            -H "Content-Type: application/json" -d '{"places": ["menu"]}' > /dev/null
          entry="$XDG_DATA_HOME/applications/junkzero.desktop"
          cat "$entry"
          grep -qx "Exec=$bin" "$entry"
          icon=$(sed -n 's/^Icon=//p' "$entry")
          test -f "$icon" || { echo "The menu entry's icon is missing"; exit 1; }
          sudo apt-get install -y -q desktop-file-utils > /dev/null
          desktop-file-validate "$entry"
          echo "The portable copy added a valid applications-menu entry"
      - name: Build the tar.gz and the .deb
        run: packaging/linux/build-linux.sh
      - name: Smoke test installing, scheduling and uninstalling the .deb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cron
          packaging/linux/smoke-test-deb.sh dist/junkzero_*_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: JunkZero-Linux
          path: |
            dist/JunkZero-Linux-x86_64.tar.gz
            dist/junkzero_*_amd64.deb
          if-no-files-found: error

  publish:
    # A pushed v* tag, or a manual run on main that tags the version in app/__init__.py
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-exe, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: JunkZero-Windows
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: JunkZero-macOS
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: JunkZero-Linux
          path: assets
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum JunkZero-Setup.exe JunkZero-Windows-portable.zip JunkZero-macOS.dmg JunkZero-macOS.zip \
            JunkZero-Linux-x86_64.tar.gz junkzero_*_amd64.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Work out the version and release notes
        id: version
        run: |
          version=$(python3 -c "import app; print(app.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi
          # Releases are made only from what is on main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main" >&2
            exit 1
          fi
          # A manual run must not reuse a version that was already released
          if [[ "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump the version in app/__init__.py first" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # The CHANGELOG section for this version, without its heading
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" assets/JunkZero-Setup.exe assets/JunkZero-Windows-portable.zip \
            assets/JunkZero-macOS.dmg assets/JunkZero-macOS.zip assets/JunkZero-Linux-x86_64.tar.gz \
            assets/junkzero_*_amd64.deb assets/SHA256SUMS.txt \
            --title "JunkZero $TAG" --notes-file notes.md --target "$GITHUB_SHA"
