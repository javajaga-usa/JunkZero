name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Rules are in ruff.toml: real errors only (syntax, undefined names), not style
      - run: python -m pip install ruff==0.16.8
      - run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/ui/app.js

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']  # 3.12 builds the releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/ui/app.js
      - run: node --test tests/test_ui.cjs

  browser:
    # The real page in Chromium: scan a folder with junk, delete it permanently, check it is gone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_browser.py -p no:cacheprovider
        env:
          JUNKZERO_REQUIRE_BROWSER: '1'

  launchers:
    # The launchers (run.bat, run.command, run.sh) set up .venv on a fresh checkout, start
    # JunkZero, and skip the install the next time
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          call run.bat --version < NUL > first.txt 2>&1
          if errorlevel 1 (type first.txt & exit /b 1)
          type first.txt
          findstr /c:"JunkZero " first.txt >NUL || exit /b 1
          if not exist .venv\.junkzero-requirements.txt exit /b 1
          call run.bat --version < NUL > second.txt 2>&1
          type second.txt
          findstr /c:"Installing" second.txt >NUL && exit /b 1
          findstr /c:"JunkZero " second.txt >NUL || exit /b 1
          exit /b 0
      - if: runner.os == 'macOS'
        run: |
          ./run.command --version | tee first.txt
          grep -q "^JunkZero " first.txt
          test -f .venv/.junkzero-requirements
          ./run.command --version | tee second.txt
          ! grep -q "Installing" second.txt
      - if: runner.os == 'Linux'
        run: |
          ./run.sh --version | tee first.txt
          grep -q "^JunkZero " first.txt
          test -f .venv/.junkzero-requirements
          ./run.sh --version | tee second.txt
          ! grep -q "Installing" second.txt
