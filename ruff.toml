# Lint run by CI (.github/workflows/ci.yml): only rules that catch real errors (syntax errors,
# broken comparisons, misplaced statements, undefined names). Style rules are not enforced.
target-version = "py310"
extend-include = ["packaging/*.spec"]

[lint]
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
# PyInstaller provides Analysis, EXE, SPECPATH and the rest when it runs a spec
"packaging/*.spec" = ["F821"]
